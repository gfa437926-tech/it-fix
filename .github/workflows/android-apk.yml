name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "firebase-applet-config.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Build web application
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Configure native Google authentication
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          # The plugin requires Google Credential Manager dependencies in Capacitor 7.
          if ! grep -q "rgcfaIncludeGoogle" android/variables.gradle; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path("android/variables.gradle")
          source = path.read_text()
          marker = "ext {"
          if marker not in source:
              raise SystemExit("Could not locate ext block in android/variables.gradle")
          source = source.replace(marker, marker + "\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
          path.write_text(source)
          PY
          fi
          # Optional base64-encoded google-services.json secret enables runtime Firebase
          # configuration in CI-built APKs. Never commit the JSON credentials file.
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            echo "$FIREBASE_ANDROID_CONFIG" | base64 --decode > android/app/google-services.json
            # Firebase Android requires the Google Services Gradle plugin in addition
            # to google-services.json. Apply it only when the config secret is present.
            python3 - <<'PY'
          from pathlib import Path

          root_gradle = Path("android/build.gradle")
          app_gradle = Path("android/app/build.gradle")
          root = root_gradle.read_text()
          app = app_gradle.read_text()

          plugin_classpath = "classpath 'com.google.gms:google-services:4.4.2'"
          if plugin_classpath not in root:
              marker = "dependencies {"
              if marker not in root:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root = root.replace(marker, marker + "\n        " + plugin_classpath, 1)
              root_gradle.write_text(root)

          plugin_apply = "apply plugin: 'com.google.gms.google-services'"
          if plugin_apply not in app:
              marker = "apply plugin: 'com.android.application'"
              if marker not in app:
                  raise SystemExit("Could not locate Android application plugin")
              app = app.replace(marker, marker + "\n" + plugin_apply, 1)
              app_gradle.write_text(app)
          PY
          fi
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Fix-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
