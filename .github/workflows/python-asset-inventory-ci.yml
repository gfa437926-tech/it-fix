name: Python Asset Inventory CI

on:
  push:
    branches: [work/python-asset-inventory]
    paths:
      - "python_app/**"
      - ".github/workflows/python-asset-inventory-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "python_app/**"
      - ".github/workflows/python-asset-inventory-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_app/requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q python_app
      - name: Run asset inventory tests
        run: python -m pytest python_app/tests
